[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; 1. Virtual display the browser renders into
[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 2. VNC server sharing that display (password from env APPROVAL_PIN)
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -passwd %(ENV_APPROVAL_PIN)s
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 2.5 One persistent Chromium instance, started at boot.
;     Fleet browser calls attach to this via CDP instead of relaunching a fresh browser each time.
[program:chromium]
command=chromium --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-background-networking --disable-default-apps --disable-extensions --disable-sync --metrics-recording-only --no-first-run --no-default-browser-check --disable-session-crashed-bubble --user-data-dir=/data/profile --window-size=1440,860 --window-position=0,0 about:blank
priority=25
autostart=true
autorestart=true
environment=DISPLAY=":99",HOME="/root",XDG_CONFIG_HOME="/root/.config"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 3. noVNC: the browser-based live view + takeover screen
[program:novnc]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 4. agent-browser MCP server, bridged from stdio to streamable HTTP for Fleet
;    Wait for Chromium's DevTools port before starting the MCP bridge.
[program:mcp]
command=/bin/sh -lc 'until curl -fsS http://127.0.0.1:9222/json/version >/dev/null; do sleep 1; done; exec supergateway --stdio "agent-browser --cdp 9222 mcp --tools core" --outputTransport streamableHttp --port 8931 --healthEndpoint /healthz'
priority=40
autostart=true
autorestart=true
environment=DISPLAY=":99",HOME="/root",XDG_CONFIG_HOME="/root/.config"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 5. Caddy: single public port, routes /mcp (with API-key check) and /view (live screen)
[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 6. Langfuse probe: emits a trace of process/port health when credentials are present
[program:langfuse-probe]
command=python /opt/trace_monitor.py
priority=60
autorestart=true
environment=DISPLAY=":99",PORT="8080"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
