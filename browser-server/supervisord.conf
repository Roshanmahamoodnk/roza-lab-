[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; 1. Virtual display the browser renders into
[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 2. VNC server sharing that display (password from env APPROVAL_PIN)
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -passwd %(ENV_APPROVAL_PIN)s
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 3. noVNC: the browser-based live view + takeover screen
[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 4. browser-use MCP server, bridged from stdio to streamable HTTP for Fleet
;    Low-level tools (navigate/click/type/extract) — Fleet's agent LLM drives them directly.
[program:mcp]
command=supergateway --stdio "browser-use --mcp" --outputTransport streamableHttp --port 8931 --healthEndpoint /healthz
priority=40
autorestart=true
environment=DISPLAY=":99",BROWSER_USE_HEADLESS="false"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 5. Caddy: single public port, routes /mcp (with API-key check) and /view (live screen)
[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
